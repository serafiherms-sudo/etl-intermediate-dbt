version: 2

models:
  - name: int_tpch_sf1__region
    description: Intermediate model that joins region and nation tables
    columns:
      - name: region_name
      - name: nation_name
      - name: nation_key    
  - name: int_tpch_sf1__customers
    description: Intermediate model that joins nation table with customers to show the nation where they belong to                                    
    columns: 
      - name: customer_key
      - name: customer_name
      - name: customer_address
      - name: customer_nation
      - name: customer_phone
      - name: customer_account_balance
      - name: customer_mkt_segment
  - name: int_tpch_sf1__orders
    description: Intermediate model that changes the date format of order_date from the staging order model
    columns: 
      - name: order_key
      - name: customer_key
      - name: order_status
      - name: order_total_price
      - name: order_date      
      - name: order_priority
      - name: order_clerk
      - name: order_ship_priority
  - name: int_tpch_sf1__supplier
    description: Intermediate model that joins nation with supplier and joins supplier with part supplier.
    columns: 
      - name: partsupp_key
      - name: part_key
      - name: supplier_key
      - name: part_supplier_available_quantity
      - name: part_supplier_supply_cost
      - name: supplier_name
      - name: supplier_address
      - name: nation_key
      - name: nation_name
      - name: supplier_phone
      - name: supplier_account_balance
  - name: int_tpch_sf1__lineitem
    description: Intermediate model that joins part supplier with lineitem to show line item details with associated part and supplier information
    columns:
      - name: partsupp_key
      - name: part_key
      - name: supplier_key
      - name: part_supplier_available_quantity
      - name: part_supplier_supply_cost
      - name: supplier_name
      - name: supplier_address
      - name: nation_key
      - name: nation_name
      - name: supplier_phone
      - name: supplier_account_balance