version: 2 

sources: 
  - name: tpch_sf1
    database: snowflake_sample_data
    schema: tpch_sf1

    tables: 
      - name: customer
        columns:
          - name: c_custkey
            data_tests:
              - unique
              - not_null
      - name: lineitem 
        columns: 
          - name: l_returnflag
            data_tests:
            - accepted_values:
                arguments:
                  values: ['A', 'R', 'N']
          - name: l_linestatus
            data_tests:
            - accepted_values:
                arguments:
                  values: ['O', 'F']                  
      - name: nation
        columns:
          - name: n_nationkey
            data_tests:
              - unique
              - not_null
      - name: orders
        columns:
          - name: o_orderkey
            data_tests:
              - unique
              - not_null          
          - name: o_orderstatus
            data_tests:
            - accepted_values:
                arguments:
                  values: ['F', 'P', 'O']
          - name: o_orderpriority
            data_tests:
            - accepted_values:
                arguments:
                  values: ['1-URGENT', '2-HIGH', '3-MEDIUM', '4-NOT SPECIFIED', '5-LOW']                
      - name: part
        columns:
          - name: p_partkey
            data_tests:
              - unique
              - not_null      
      - name: partsupp                    
      - name: region
        columns:
          - name: r_regionkey
            data_tests:
              - unique
              - not_null       
      - name: supplier
        columns:
          - name: s_suppkey
            data_tests:
              - unique
              - not_null                  