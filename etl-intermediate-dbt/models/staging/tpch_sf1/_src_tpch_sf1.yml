version: 2 

sources: 
  - name: tpch_sf1
    database: snowflake_sample_data
    schema: tpch_sf1

    tables: 
      - name: customer
        columns:
          - name: c_custkey
            data_tests:
              - unique
              - not_null
      - name: lineitem 
        columns: 
          - name: l_returnflag
            data_tests:
            - accepted_values:
                arguments:
                  values: ['A', 'R', 'N']
          - name: l_linestatus
            data_tests:
            - accepted_values:
                arguments:
                  values: ['O', 'F']
          - name: l_discount
            data_tests:
              - is_positive
          - name: l_quantity
            data_tests:
              - is_positive
          - name: l_tax
            data_tests:
              - is_positive
          - name: l_extendedprice
            data_tests:
              - is_positive
          - name: l_shipdate  
            data_tests:
              - dbt_expectations.expect_column_values_to_be_of_type:
                  column_type: date
          - name: l_commitdate  
            data_tests:
              - dbt_expectations.expect_column_values_to_be_of_type:
                  column_type: date
          - name: l_receiptdate  
            data_tests:
              - dbt_expectations.expect_column_values_to_be_of_type:
                  column_type: date                                     
      - name: nation
        columns:
          - name: n_nationkey
            data_tests:
              - unique
              - not_null
      - name: orders
        columns:
          - name: o_orderkey
            data_tests:
              - unique
              - not_null          
          - name: o_orderstatus
            data_tests:
            - accepted_values:
                arguments:
                  values: ['F', 'P', 'O']
          - name: o_orderdate
            data_tests:
              - dbt_expectations.expect_column_values_to_be_of_type:
                  column_type: date
          - name: o_orderpriority
            data_tests:
            - accepted_values:
                arguments:
                  values: ['1-URGENT', '2-HIGH', '3-MEDIUM', '4-NOT SPECIFIED', '5-LOW']        
          - name: o_totalprice
            data_tests:
              - is_positive                
      - name: part
        columns:
          - name: p_partkey
            data_tests:
              - unique
              - not_null
          - name: p_retailprice
            data_tests:
              - is_positive          
      - name: partsupp
        columns:
          - name: ps_supplycost
            data_tests:
              - is_positive
          - name: ps_availqty
            data_tests:
              - is_positive                    
      - name: region
        columns:
          - name: r_regionkey
            data_tests:
              - unique
              - not_null       
      - name: supplier
        columns:
          - name: s_suppkey
            data_tests:
              - unique
              - not_null                  