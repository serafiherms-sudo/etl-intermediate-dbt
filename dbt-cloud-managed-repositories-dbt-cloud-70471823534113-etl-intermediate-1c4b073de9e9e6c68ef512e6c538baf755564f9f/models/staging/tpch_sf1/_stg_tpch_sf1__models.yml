version: 2

models:
  - name: stg_tpch_sf1__lineitem
    description: 'Staging model of line item table'
    columns: 
      - name: item_key
        description: 'Surrogate key composed of orderkey, partkey and supplierkey'
        data_tests:
          - unique
          - not_null
  - name: stg_tpch_sf1__partsupp
    description: 'Staging model of partsup table'
    columns:
      - name: partsupp_key
        description: 'Surrogate key composed by ps_partkey and ps_suppkey'
        data_tests: 
        - unique
        - not_null
  - name: stg_tpch_sf1__orders
    columns: 
      - name: order_key
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_tpch_sf1__lineitem')
                field: order_key
  - name: stg_tpch_sf1__part
    columns: 
      - name: part_key
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_tpch_sf1__partsupp')
                field: part_key                
     
        